name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 当你向 main 分支 push 代码时自动触发部署 (如果是 master 请修改为 master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build UI
        run: yarn build-ui  # 调用 package.json 中现有的打包脚本

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'  # 原项目的 UI 打包输出目录为 docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4